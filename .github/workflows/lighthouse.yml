name: Lighthouse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  lighthouse:
    name: Lighthouse budgets (5 pages × 3 runs, mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (canonical URLs match the server Lighthouse tests)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Run Lighthouse CI (budgets in frontend/lighthouserc.json)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
          retention-days: 14
